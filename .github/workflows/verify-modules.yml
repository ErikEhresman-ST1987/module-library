name: Verify reusable modules
on:
  pull_request:
    paths:
      - 'modules/**'
      - 'tests/**'
      - '.github/workflows/verify-modules.yml'
  push:
    branches:
      - 'audit/module-verification-2026-10-09'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/modules.test.mjs
